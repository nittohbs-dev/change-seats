<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント情報</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card">
  <h1>アカウント情報</h1>
  <form id="form">
    <label for="name">名前（必須・100文字まで・席決め画面と共通）</label>
    <input type="text" id="name" name="name" maxlength="100" placeholder="名前">
    <label>今日のお題</label>
    <div class="readonly-box" id="topic"></div>
    <label for="issue">現状の個人の課題（任意・200文字まで）</label>
    <textarea id="issue" name="issue" maxlength="200" rows="3" placeholder="例：会議での発言が少ない"></textarea>
    <label for="effort">課題解決にむけて取り組んでいること（任意・200文字まで）</label>
    <textarea id="effort" name="effort" maxlength="200" rows="3" placeholder="例：毎回の会議で1回は意見を言う"></textarea>
    <p class="note">入力した内容は、変更するまで保存されます。座席配置図で名前を押すと、ほかの人も見られます。</p>
    <p id="msg" class="msg error"></p>
    <button type="submit" class="btn-block">決定</button>
  </form>
</main>
<script src="/static/app.js"></script>
<script>
  const msg = document.getElementById('msg');

  api('/me').then((me) => {
    document.getElementById('name').value = me.name;
    document.getElementById('issue').value = me.issue ?? '';
    document.getElementById('effort').value = me.effort ?? '';
    document.getElementById('topic').textContent = me.topic ?? 'お題なし';
  }).catch(fail(msg));

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showMsg(msg, '');
    try {
      const r = await api('/account', { method: 'POST', data: new FormData(e.target) });
      location.href = r.redirect;
    } catch (err) { fail(msg)(err); }
  });
</script>
</body>
</html>
