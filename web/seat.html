<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座席</title>
  <link rel="stylesheet" href="/static/style.css">
  </head>
<body>
<main class="card mid">
  <div class="header">
    <h1>座席</h1>
    <a href="/account"><button type="button" class="btn-small">アカウント情報</button></a>
  </div>
  <div id="map"></div>
  <p class="note">青い円があなたの席です。</p>
  <p id="msg" class="msg error"></p>
  <a href="/office"><button type="button" class="btn-block btn-primary">バーチャルオフィスへ</button></a>
  <button type="button" id="leave" class="btn-block">帰社（ログアウト）</button>
  <p class="midnight-note">毎日 0:00 になると、全員が自動で帰社します</p>
</main>
<script src="/static/app.js"></script>
<script>
  const msg = document.getElementById('msg');
  const map = document.getElementById('map');
  const viewReady = createSeatMap2d(map);

  // 戻る操作をしても、この画面に留まる
  history.pushState(null, '', location.href);
  addEventListener('popstate', () => history.pushState(null, '', location.href));

  async function refresh() {
    try {
      const me = await api('/me');
      if (!me.seated) {
        alert('0時になったため、自動で帰社しました。');
        return logoutAndGoHome();
      }
      const [data, view] = await Promise.all([api('/seat-map'), viewReady]);
      view.update(data);
      showMsg(msg, '');
    } catch (err) { fail(msg)(err); }
  }

  document.getElementById('leave').addEventListener('click', async () => {
    try {
      const r = await api('/seat/leave', { method: 'POST' });
      location.href = r.redirect;
    } catch (err) { fail(msg)(err); }
  });

  refresh();
  watchSeatMap(refresh);
</script>
</body>
</html>
