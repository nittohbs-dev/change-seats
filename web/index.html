<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座席管理 ホーム</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<div class="autumn-bg" aria-hidden="true">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- もみじの葉（100×100の枠で描き、位置・角度・大きさを変えて並べる） -->
      <symbol id="leaf" viewBox="0 0 100 100">
        <path d="M50 4 L57 25 L67 17 L64 38 L81 27 L77 43 L96 42 L81 55 L87 63 L66 64 L70 79 L54 70 L52.5 96 L47.5 96 L46 70 L30 79 L34 64 L13 63 L19 55 L4 42 L23 43 L19 27 L36 38 L33 17 L43 25 Z"/>
      </symbol>
    </defs>
    <g opacity="0.88">
      <!-- 左上 -->
      <use href="#leaf" width="100" height="100" fill="#e2412f" transform="translate(-20 -10) scale(2.2) rotate(-25 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f28a2e" transform="translate(150 40) scale(1.3) rotate(20 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f6c33b" transform="translate(40 200) scale(1.1) rotate(-50 50 50)"/>
      <!-- 右上 -->
      <use href="#leaf" width="100" height="100" fill="#f28a2e" transform="translate(800 -30) scale(2.3) rotate(30 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#d8352a" transform="translate(700 120) scale(1.2) rotate(-15 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f6c33b" transform="translate(890 250) scale(0.9) rotate(60 50 50)"/>
      <!-- 舞い落ちる小さな葉 -->
      <use href="#leaf" width="100" height="100" fill="#e2412f" transform="translate(300 330) scale(0.6) rotate(40 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f28a2e" transform="translate(640 420) scale(0.55) rotate(-35 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f6c33b" transform="translate(120 560) scale(0.7) rotate(15 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#d8352a" transform="translate(860 600) scale(0.65) rotate(-60 50 50)"/>
      <!-- 左下 -->
      <use href="#leaf" width="100" height="100" fill="#f6c33b" transform="translate(-30 780) scale(2.0) rotate(10 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#d8352a" transform="translate(170 860) scale(1.3) rotate(-40 50 50)"/>
      <!-- 右下 -->
      <use href="#leaf" width="100" height="100" fill="#e2412f" transform="translate(780 760) scale(2.4) rotate(-20 50 50)"/>
      <use href="#leaf" width="100" height="100" fill="#f28a2e" transform="translate(660 890) scale(1.0) rotate(45 50 50)"/>
    </g>
  </svg>
</div>
<main class="card">
  <h1>座席管理</h1>
  <form id="form">
    <label for="id">アカウントID</label>
    <input type="text" id="id" name="id" placeholder="ID" autocomplete="username">
    <label for="password">パスワード</label>
    <input type="password" id="password" name="password" placeholder="パスワード" autocomplete="current-password">
    <p id="msg" class="msg error"></p>
    <button type="submit" class="btn-block btn-primary">ログイン</button>
  </form>
  <div class="right">
    <a href="/register"><button type="button" class="btn-small">アカウント作成</button></a>
  </div>
  <div class="test-hint">
    テスト版: IDとパスワードを入れれば誰でもログインできます。<br>
    ID を <b>admin</b> にすると管理用画面に入れます。<br>
    別のブラウザやシークレットウィンドウで違うIDを使うと、複数人の席決めを試せます。
  </div>
</main>
<script src="/static/app.js"></script>
<script>
  const msg = document.getElementById('msg');
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showMsg(msg, '');
    try {
      const r = await api('/login', { method: 'POST', data: new FormData(e.target) });
      location.href = r.redirect;
    } catch (err) { fail(msg)(err); }
  });
</script>
</body>
</html>
